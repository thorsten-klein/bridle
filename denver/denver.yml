version: "1.0"
# lowest denver version that can run this file
denver-version: ">=1.6.3"

# A Zephyr 4.3.1 dev environment, without docker or conan. Native tools and
# the Zephyr SDK get downloaded directly instead. See README.md for why.
stages:
- workspace-guard       # refuses to start if 'topdir:' below would point west outside a workspace checkout
- host-tools           # apt packages the rest needs (git, gperf, dtc, ...)
- native-tools          # cmake, ninja, clang, fish, doxygen, protoc, SystemView
- zephyr-sdk-download   # the SDK's 4 release archives (base + 3 cross toolchains)
- zephyr-sdk            # combines the 4 archives above into one SDK install
- jlink                 # SEGGER J-Link tools (needs a license-accepting POST)
- uv                    # the venv west itself runs from
- zephyr                # 'west update' clones zephyr-rtos + modules, applies patches
- uv-zephyr             # `west packages pip` -- the modules' own python deps

# start bash in the environment by default
# Note: any bashrc may unconditionally overwrite PROMPT_COMMAND or PS1, discarding
# denver's context marker. setup/bash-rc.sh applies according PS1 modification.
command: ['bash', '-c', 'exec bash --rcfile "$DENVER_ENV_DIR/setup/bash-rc.sh" -i']

# general env vars
hooks:
  env:
  - env.sh

workspace-guard:
  provider: custom
  description:
  - "Safety check to ensure that the repo parent matches zephyr T2 topology with recommended naming pattern."
  cmd: |
    PARENT_DIR="$(realpath "${DENVER_ENV_DIR}/..")"
    PARENT_NAME="$(basename "$(dirname "$PARENT_DIR")")"
    case "$PARENT_NAME" in
      *workspace|*ws)
        exit 0
        ;;
    esac
    echo "Your setup seems not to match zephyr T2 topology." >&2
    echo "Expected bridle to be cloned into a workspace folder (named *workspace or *ws)" >&2
    exit 1
    ;;

host-tools:
  provider: custom
  description:
  - Checks that the apt packages the other stages need are installed. Installing them needs sudo, so that's a separate step.
  - Run ' denver --scripts setup' manually to install them, as installation is not part of a normal run.
  cmd: bash ${DENVER_ENV_DIR}/setup/check_host_tools.sh
  scripts:
    setup:
    - setup/install_host_tools.sh

native-tools:
  provider: download
  description:
  - Downloads fixed versions of necessary tools.
  packages:
  - name: cmake
    url: https://github.com/Kitware/CMake/releases/download/v3.31.9/cmake-3.31.9-linux-x86_64.tar.gz
    md5sum: 7c102bf491091679895362bb8ae3f4bb
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1'
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}/bin:"
  - name: ninja
    url: https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
    md5sum: 54a25b8d5b5bed15c1bf051a629b42bb
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}:"
  - name: clang
    url: https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.4/LLVM-21.1.4-Linux-X64.tar.xz
    md5sum: bc42e986dbe585461fb837542769bc7a
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1'
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}/bin:"
  - name: doxygen
    url: https://github.com/doxygen/doxygen/releases/download/Release_1_15_0/doxygen-1.15.0.linux.bin.tar.gz
    md5sum: 72f0b4d9b5280f28be54745a815d8a74
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1'
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}/bin:"
  - name: protoc
    url: https://github.com/protocolbuffers/protobuf/releases/download/v33.2/protoc-33.2-linux-x86_64.zip
    md5sum: 6c39e1779a3b830f583214b691b4b7d4
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}/bin:"
  - name: fish
    url: https://github.com/fish-shell/fish-shell/releases/download/4.8.1/fish-4.8.1-linux-x86_64.tar.xz
    md5sum: 921a8b099fa64d8565b27ffcb588c540
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}:"
  - name: systemview
    url: https://www.segger.com/downloads/jlink/SystemView_Linux_V362b_x86_64.tgz
    md5sum: c4e790c320566ec0bac903edf714af2f
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1'
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}:"

zephyr-sdk-download:
  provider: download
  description:
  - Downloads the Zephyr SDK as 4 separate archives -- the minimal base plus the arm/riscv64/x86_64 toolchains. The 'zephyr-sdk' stage below combines them into one SDK.
  env:
    ZEPHYR_SDK_INSTALL_DIR: "${DENVER_ENV_WORKDIR}/download/zephyr-sdk-minimal"
  packages:
  - name: zephyr-sdk-minimal
    url: https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/zephyr-sdk-1.0.1_linux-x86_64_minimal.tar.xz
    md5sum: 1508c9ad1f1c511e9d6fdb051ef33129
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1'
  - name: zephyr-toolchain-arm-zephyr-eabi
    url: https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/toolchain_gnu_linux-x86_64_arm-zephyr-eabi.tar.xz
    md5sum: da38a6b6a20bfae8249ab9c7eef72cdd
    # real tar, not python's own unpacker: this archive has a relative
    # symlink (lib/bfd-plugins/liblto_plugin.so) that some python tarfile
    # versions refuse to extract, treating it as pointing outside the
    # destination even though it doesn't
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE"'
  - name: zephyr-toolchain-riscv64-zephyr-elf
    url: https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/toolchain_gnu_linux-x86_64_riscv64-zephyr-elf.tar.xz
    md5sum: 96144011c642c18b71afd3dff3b6439b
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE"'
  - name: zephyr-toolchain-x86_64-zephyr-elf
    url: https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v1.0.1/toolchain_gnu_linux-x86_64_x86_64-zephyr-elf.tar.xz
    md5sum: 35ef9625c83793a95b2da4c1805c635c
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE"'

zephyr-sdk:
  provider: custom
  description:
  - "Links the three toolchains into the minimal SDK's own root, so 'gnu/<toolchain>' resolves the way zephyr's own build scripts expect."
  depends-on:
  - zephyr-sdk-download
  # $DENVER_ENV_WORKDIR/$ZEPHYR_SDK_INSTALL_DIR deliberately written bare
  # (no ${...}) -- denver interpolates '${VAR}' in 'cmd:' itself, before
  # bash ever sees it (see interpolate_shell), and would silently replace
  # an unknown name like '${ZEPHYR_TOOLCHAIN_PREFIX}' with '' instead of
  # leaving it for bash. Bare '$VAR' bypasses that and resolves normally,
  # from the real environment both already are.
  cmd: |
    SDK_GNU_DIR="$ZEPHYR_SDK_INSTALL_DIR/gnu"
    ZEPHYR_TOOLCHAIN_PREFIX="$DENVER_ENV_WORKDIR/download/zephyr-toolchain"
    mkdir -p "$SDK_GNU_DIR"
    ln -sfnv "$ZEPHYR_TOOLCHAIN_PREFIX-arm-zephyr-eabi/arm-zephyr-eabi"            "$SDK_GNU_DIR/arm-zephyr-eabi"
    ln -sfnv "$ZEPHYR_TOOLCHAIN_PREFIX-riscv64-zephyr-elf/riscv64-zephyr-elf"      "$SDK_GNU_DIR/riscv64-zephyr-elf"
    ln -sfnv "$ZEPHYR_TOOLCHAIN_PREFIX-x86_64-zephyr-elf/x86_64-zephyr-elf"        "$SDK_GNU_DIR/x86_64-zephyr-elf"

jlink:
  provider: download
  description:
  - "SEGGER J-Link tools. SEGGER only gives you the real file after a POST that accepts its license agreement -- a plain GET just returns a web page. 'method: POST' and 'data:' below do that."
  packages:
  - name: jlink
    url: https://www.segger.com/downloads/jlink/JLink_Linux_V882_x86_64.tgz
    method: POST
    data: accept_license_agreement=accepted&submit=Download+software
    md5sum: 1691b1c79764bf1caade424cc39c2e0c
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1'
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}:"
      LD_LIBRARY_PATH: "${DENVER_UNPACK_DIR}:"

uv:
  provider: uv
  description:
  - The python virtualenv that west runs from.
  python: "3.12.3"
  requirements:
  - uv/requirements.txt
  skip-on-success:
  - uv/skip-on-success.sh

zephyr:
  provider: zephyr
  description:
  - "Runs 'west update': clones zephyr-rtos and its modules at the pinned 4.3.1 versions."
  topdir: "${DENVER_ENV_DIR}/../.."
  # same reason: without this, west would use bridle's own root west.yml
  # instead of this env's own copy
  west-yml: "${DENVER_ENV_DIR}/../west.yml"
  scripts:
    setup:
    - setup/install_jlink_udev_rules.sh

uv-zephyr:
  provider: uv
  description:
  - "Installs the python packages the cloned zephyr modules need ('west packages pip'). Uses the same virtualenv as the 'uv' stage above, so west can see what gets installed."
  install-args:
  - $(west packages pip)
  skip-on-success:
  - uv/skip-on-success.sh
